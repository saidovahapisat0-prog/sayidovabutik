<!DOCTYPE html>

<body>

    <!-- Əsas Ana Konteyner -->
    <div class="site-wrapper">

            <!-- Arxa plan şəkli (Yalnız mobil görünüş üçün aktivləşir) -->

                <div class="links-wrapper">

                    </a>

                    <a href="#collections" class="link-btn">

                    </a>

                    <a href="#orders" class="link-btn">
                        <i class="fas fa-cut"></i>

                    </a>

                    <a href="https://wa.me/994XXXXXXXXX" target="_blank" class="link-btn highlight-btn">
                        <i class="fab fa-whatsapp"></i>
                        <span>Bizimlə Əlaqə (WhatsApp)</span>
                    </a>
                </div>

                <!-- Sosial Şəbəkələr -->
                <div class="social-links">
                    <a href="#" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="https://wa.me/994XXXXXXXXX" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
